<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a9f4a"><title>CLICK & PAY — Démo</title>
<style>
:root{--g:#0a9f4a;--d:#075b30;--o:#ff9f1c;--bg:#f4f7f5;--line:#dfe7e2}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#14221b}.app{max-width:1200px;margin:auto;padding:16px}.head{background:#fff;border-bottom:1px solid var(--line);padding:14px;position:sticky;top:0;z-index:4}.logo{font-size:25px;font-weight:900}.logo span{color:var(--o)}.nav{display:flex;gap:8px;overflow:auto;margin-top:12px}.nav button,.btn{border:0;border-radius:11px;padding:10px 13px;background:#edf5f0}.nav .on,.primary{background:var(--g);color:white}.hero{margin-top:18px;background:linear-gradient(135deg,var(--g),var(--d));color:#fff;border-radius:24px;padding:28px}.hero h1{font-size:clamp(34px,7vw,60px);margin:0}.search{margin:18px 0}.search input{width:100%;padding:15px;border:1px solid var(--line);border-radius:13px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.pic{height:130px;border-radius:14px;background:#edf7f1;display:grid;place-items:center;font-size:58px}.price{font-size:20px;font-weight:900}.add{width:100%;background:var(--g);color:white;border:0;border-radius:11px;padding:11px;font-weight:bold}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#e7f7ed;color:#075b30;font-size:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.cart{position:fixed;right:18px;bottom:18px;background:var(--g);color:white;border:0;border-radius:99px;padding:14px 18px;font-weight:bold;box-shadow:0 8px 30px #0003}.drawer,.modal{position:fixed;z-index:10}.drawer{right:0;top:0;width:min(430px,100%);height:100%;background:#fff;padding:18px;overflow:auto;box-shadow:-10px 0 35px #0003}.overlay{position:fixed;inset:0;background:#0006;z-index:9}.modal{inset:0;background:#0006;display:grid;place-items:center;padding:18px}.box{background:#fff;border-radius:20px;padding:22px;width:min(500px,100%)}select,input{padding:12px;border:1px solid var(--line);border-radius:10px;width:100%;margin:7px 0 12px}
</style></head><body><div class="app"><header class="head"><div class="logo">CLICK <span>& PAY</span></div><div class="nav" id="nav"></div></header><main id="main"></main></div><div id="layer"></div>
<script>
const P=[["1","🍚","Riz local 25 kg",12500],["2","🫗","Huile Dinor 5 L",5900],["3","🧂","Sucre 1 kg",1500],["4","🥛","Lait Nido 400 g",2000],["5","🧼","Savon Palmolive",1000],["6","🧃","Jus d'orange 1 L",1500],["7","🌾","Farine 1 kg",1200],["8","🍪","Biscuits chocolat",900]];
let page="home",q="",cart=[],orders=[];
const money=n=>new Intl.NumberFormat("fr-FR").format(n)+" FCFA";
function nav(){document.querySelector("#nav").innerHTML=[["home","Accueil"],["stores","Magasins"],["orders","Commandes"],["admin","Admin"]].map(x=>`<button class="${page==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}
function go(x){page=x;render()}
function render(){nav();document.querySelector("#main").innerHTML=page==="home"?home():page==="stores"?stores():page==="orders"?orders():admin()}
function home(){let a=P.filter(x=>x[2].toLowerCase().includes(q.toLowerCase()));return `<section class="hero"><h1>CLIQUEZ. PAYEZ.<br>C'EST ACHETÉ.</h1><p>Démo CLICK & PAY — commerce digital multi-enseignes.</p></section><div class="search"><input placeholder="Rechercher un produit..." value="${q}" oninput="q=this.value;render()"></div><h2>🔥 Promotions</h2><div class="grid">${a.map(p=>`<article class="card"><div class="pic">${p[1]}</div><span class="tag">Disponible</span><h3>${p[2]}</h3><div class="price">${money(p[3])}</div><button class="add" onclick="add('${p[0]}')">Ajouter au panier</button></article>`).join("")}</div>${cart.length?`<button class="cart" onclick="openCart()">🛒 Panier (${cart.reduce((a,x)=>a+x.q,0)})</button>`:""}`}
function stores(){return `<h1>🏪 Magasins</h1><div class="grid">${["Supermarché ABC","Super U Bamako","Marché Express"].map(x=>`<div class="card"><h2>${x}</h2><p>📍 Bamako<br>⭐ 4,7<br>🚚 Livraison · 🏪 Retrait</p><button class="add" onclick="go('home')">Voir les produits</button></div>`).join("")}</div>`}
function orders(){return `<h1>📦 Mes commandes</h1>${orders.length?orders.map(o=>`<div class="panel"><div class="row"><b>#${o.id}</b><span class="tag">Confirmée</span></div><p>${money(o.total)} · ${o.items} produits</p></div>`).join(""):`<div class="panel">Aucune commande.</div>`}`}
function admin(){return `<h1>👑 Back-office CLICK & PAY</h1><div class="grid"><div class="card"><b>Enseignes</b><h2>54</h2></div><div class="card"><b>Magasins</b><h2>132</h2></div><div class="card"><b>Clients</b><h2>3 245</h2></div><div class="card"><b>Commandes</b><h2>12 548</h2></div></div><div class="panel"><h2>Fonctions</h2><p>Produits · stocks · commandes · paiements · livraison · QR retrait · Scan & Pay · abonnements.</p></div>`}
function add(id){let x=cart.find(x=>x.id===id);x?x.q++:cart.push({id,q:1});render()}
function openCart(){let total=cart.reduce((s,x)=>s+P.find(p=>p[0]===x.id)[3]*x.q,0);document.querySelector("#layer").innerHTML=`<div class="overlay" onclick="closeL()"></div><aside class="drawer"><div class="row"><h2>🛒 Panier</h2><button class="btn" onclick="closeL()">✕</button></div>${cart.map(x=>{let p=P.find(p=>p[0]===x.id);return `<div class="panel"><div class="row"><b>${p[1]} ${p[2]}</b><b>${money(p[3]*x.q)}</b></div><p>Quantité : ${x.q}</p></div>`}).join("")}<div class="panel"><div class="row"><b>TOTAL</b><b>${money(total)}</b></div></div><button class="add" onclick="checkout()">Continuer</button></aside>`}
function checkout(){document.querySelector("#layer").innerHTML=`<div class="modal"><div class="box"><h2>💳 Finaliser</h2><label>Réception</label><select><option>Retrait en magasin</option><option>Livraison à domicile</option></select><label>Paiement</label><select><option>Mobile Money</option><option>Visa / Mastercard</option><option>Paiement au retrait</option></select><button class="add" onclick="confirmOrder()">Confirmer la commande</button></div></div>`}
function confirmOrder(){let t=cart.reduce((s,x)=>s+P.find(p=>p[0]===x.id)[3]*x.q,0);orders.unshift({id:"CP"+Math.floor(Math.random()*900000+100000),total:t,items:cart.reduce((a,x)=>a+x.q,0)});cart=[];closeL();go("orders");alert("Commande confirmée 🎉")}
function closeL(){document.querySelector("#layer").innerHTML=""}render();
</script></body></html>
